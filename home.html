<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>英文單字測驗</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header><h1>英文單字測驗</h1></header>
<main class="container">
  <section class="panel">
    <h2>快速模式</h2>
    <div class="row">
      <a class="btn" href="./unit10.html?u=1">Unit1：10 題模式</a>
      <a class="btn" href="./quiz.html?u=1&mode=full">Unit1：完整測驗</a>
    </div>
  </section>
  <section class="panel">
    <h2>選擇單元與模式</h2>
    <div id="units" class="units"></div>
  </section>
  <section class="panel">
    <h2>固定 10 題（快速選單）</h2>
    <div id="quick10" class="units"></div>
  </section>
</main>
<script>
const unitsBox = document.getElementById('units');
for(let i=1;i<=10;i++){
  const div = document.createElement('div');
  div.className='unit';
  div.innerHTML = `<h3>Unit ${i}</h3>
    <a class="btn" href="./quiz.html?u=${i}&mode=full">完整測驗</a>
    <a class="btn" href="./unit10.html?u=${i}">10 題模式</a>`;
  unitsBox.appendChild(div);
}
const quick = document.getElementById('quick10');
for(let u=1;u<=10;u++){
  const a=document.createElement('a');
  a.className='btn';
  a.href=`./unit10.html?u=${u}`;
  a.textContent = `Unit ${u} - 十題`;
  quick.appendChild(a);
}
</script>
</body>
</html>
