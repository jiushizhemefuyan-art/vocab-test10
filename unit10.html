<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10 題模式</title><link rel="stylesheet" href="./styles.css"></head><body><header><h1 id="title">10 題模式</h1></header><main class="container"><div id="buttons" class="grid"></div><p><a class="btn" href="./home.html">← 返回主選單</a></p></main><script>function qs(n){return new URL(location).searchParams.get(n);}const u=parseInt(qs('u')||'1',10);document.getElementById('title').innerText='Unit '+u+'｜10 題模式';const box=document.getElementById('buttons');for(let s=1;s<=91;s+=10){const e=s+9;const a=document.createElement('a');a.className='btn';a.href=`./quiz.html?u=${u}&mode=fixed10&range=${s}-${e}`;a.textContent=`${s} - ${e}`;box.appendChild(a);} </script></body></html>
