<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10題模式</title><style>body{font-family:sans-serif;background:#eef3ff;padding:20px;text-align:center}.btn{display:inline-block;padding:10px 14px;background:#4a7bff;color:#fff;margin:6px;border-radius:6px;text-decoration:none}</style></head><body><h2 id='title'></h2><div id='buttons'></div><a href='home.html' class='btn'>返回主選單</a><script src="data.js"></script>
<script>function qs(n){return new URL(location.href).searchParams.get(n);}const u=qs('u');document.getElementById('title').innerText='Unit '+u+'｜10題範圍';const box=document.getElementById('buttons');for(let s=1;s<=91;s+=10){let e=s+9;let a=document.createElement('a');a.className='btn';a.href = BASE_PATH + 'quiz.html?u='+u+'&mode=fixed10&range='+s+'-'+e;a.textContent=s+'-'+e;box.appendChild(a);} </script></body></html>
