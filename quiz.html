<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>測驗</title><link rel="stylesheet" href="./styles.css"></head><body><header><h1 id="title">測驗</h1></header><main class="container"><div id="meta"></div><div id="question-area"></div><div id="controls" style="display:none;margin-top:12px;"><button id="prev" class="btn">上一題</button><button id="next" class="btn">下一題</button><span id="progress" style="margin-left:12px"></span></div><p><a class="btn" href="./home.html">返回主選單</a></p></main><script src="./data.js"></script><script>function qp(n){return new URL(location).searchParams.get(n);}const unit=parseInt(qp('u')||'1',10);const mode=qp('mode')||qp('m')||'full';const rangeParam=qp('range')||qp('r')||'';const setParam=qp('set')||'';const all=window.vocabData||[];let pool=[];if(setParam){const setNum=parseInt(setParam,10);const s=(setNum-1)*10+1,e=setNum*10;pool=all.filter(x=>x.unit===unit&&x.id>=s&&x.id<=e);}else if(mode==='fixed10'&&rangeParam){const parts=rangeParam.split('-').map(x=>parseInt(x));const s=parts[0],e=parts[1];pool=all.filter(x=>x.unit===unit&&x.id>=s&&x.id<=e);}else if(mode==='full'){pool=all.filter(x=>x.unit===unit);}else{pool=all.filter(x=>x.unit===unit);}if(pool.length<10&&mode!=='full'){const extras=all.filter(x=>x.unit===unit).slice(0,10-pool.length);pool=pool.concat(extras);}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}shuffle(pool);const questions=(mode==='full')?pool:pool.slice(0,10);let idx=0;const answers=new Array(questions.length).fill(null);const qArea=document.getElementById('question-area');const controls=document.getElementById('controls');const prevBtn=document.getElementById('prev');const nextBtn=document.getElementById('next');const progress=document.getElementById('progress');const title=document.getElementById('title');title.textContent=`Unit ${unit} 測驗 (${questions.length} 題)`;function render(){if(idx<0)idx=0;if(idx>=questions.length)idx=questions.length-1;const q=questions[idx];qArea.innerHTML='';const qh=document.createElement('div');qh.innerHTML=`<h2>題目 ${idx+1}</h2><div class='prompt'>${q.question||q.word||('題目 #'+q.id)}</div>`;qArea.appendChild(qh);const opts=(q.options&&q.options.length)?q.options.slice():[];const list=document.createElement('div');list.className='opts';opts.forEach((opt,i)=>{const b=document.createElement('button');b.className='opt btn';b.textContent=opt;b.onclick=()=>{answers[idx]=i;[...list.querySelectorAll('button')].forEach(bt=>bt.classList.remove('selected'));b.classList.add('selected');};list.appendChild(b);});qArea.appendChild(list);controls.style.display=(questions.length>0)?'block':'none';progress.textContent=`已答 ${answers.filter(x=>x!==null).length} / ${questions.length}`;prevBtn.disabled=(idx===0);nextBtn.textContent=(idx===questions.length-1)?'結束並查看結果':'下一題';}prevBtn.onclick=()=>{idx--;render();};nextBtn.onclick=()=>{if(idx===questions.length-1){let correct=0;let report='<h2>結果</h2><ol>';for(let i=0;i<questions.length;i++){const q=questions[i];const user=answers[i];const ok=(typeof q.answerIndex!=='undefined'&&user===q.answerIndex);if(ok)correct++;report+=`<li><div>${q.question||q.word}</div><div>你的答案: ${user===null?'-':(q.options&&q.options[user]?q.options[user]:'-')}</div><div>正確: ${typeof q.answerIndex!=='undefined'?q.options[q.answerIndex]:'未提供'}</div></li>`;}report+=`</ol><p>總分：${correct} / ${questions.length}</p><p><a class='btn' href='./home.html'>回到選單</a></p>`;qArea.innerHTML=report;controls.style.display='none';return;}else{idx++;render();}};if(questions.length===0){qArea.innerHTML='<p>讀取不到題目，請確認 data.js 中有正確題庫（包含 unit 與 id 欄位）。</p>';}else{render();}</script></body></html>
